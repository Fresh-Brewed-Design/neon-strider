name: CI

# Runs on PRs, and on main after each merge. The run on main is what keeps PRs
# fast: only a cache saved from the default branch can be restored by every PR,
# so main saves the compiled dependencies and PRs only restore them. Runs that
# cannot change the app (docs, release notes) are skipped, and a newer push
# stops an older run.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "changes/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "changes/**"
      - "LICENSE"
  workflow_dispatch:

env:
  # No debug info in CI builds: faster to compile and link, and a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is the main platform: everything runs here, including the
    # OS-independent checks (formatting, typecheck, lint, bindings).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: ci
          # PR caches are private to their PR; saving them only uses up the quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Frontend tests
        run: npx vitest run

      # Before the Rust steps: the Tauri build embeds the built frontend (dist/).
      - name: Frontend build
        run: npx vite build

      # Before anything compiles: it takes a second and fails fast.
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # Every file in src/ipc/bindings is ts-rs output. Clearing them first means
      # the check below also catches a new type left uncommitted and a stale file
      # for a type that no longer exists.
      - name: Clear the generated bindings
        shell: bash
        run: rm -rf src/ipc/bindings

      - name: Rust tests (also regenerates the TypeScript IPC bindings)
        working-directory: src-tauri
        run: cargo test

      - name: Committed bindings match a fresh export
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/ipc/bindings)" ]; then
            git status --short -- src/ipc/bindings
            git diff -- src/ipc/bindings
            echo "src/ipc/bindings is out of date: run cargo test in src-tauri and commit the result (regenerate, don't hand-merge)."
            exit 1
          fi

      - name: Clippy (all targets, warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  macos:
    # The macOS build (src/platform/macos.rs, the Keychain, the menu bar app):
    # its Rust tests and clippy, on Apple Silicon. The OS-independent checks
    # run once, in the Windows job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: ci-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        run: npm ci

      # The Tauri build embeds the built frontend (dist/).
      - name: Frontend build
        run: npx vite build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy (all targets, warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  macos-bundle:
    # The release's Mac build without its signing key: a universal app and disk
    # image, as release.yml's `macos` job makes them. Too slow for every PR (two
    # release builds); run it by hand (Actions -> CI -> Run workflow) after a
    # change to the bundle config, Info.plist or the release job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: ci-macos-bundle
          save-if: false

      - name: Install JS dependencies
        run: npm ci

      - name: Build the universal app and disk image
        run: npx tauri build --target universal-apple-darwin

      - name: The app is universal, ad-hoc signed and carries the Bluetooth text
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Neon Strider.app"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")"
          lipo -archs "$exe"
          lipo -archs "$exe" | grep -q x86_64
          lipo -archs "$exe" | grep -q arm64
          codesign --verify --verbose "$app"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist"
          ls -l src-tauri/target/universal-apple-darwin/release/bundle/dmg/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neon-strider-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
