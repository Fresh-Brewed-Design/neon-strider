name: CI

# Runs on PRs, and on main after each merge. The run on main is what keeps PRs
# fast: only a cache saved from the default branch can be restored by every PR,
# so main saves the compiled dependencies and PRs only restore them. Runs that
# cannot change the app (docs, release notes) are skipped, and a newer push
# stops an older run.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "changes/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "changes/**"
      - "LICENSE"
  workflow_dispatch:

env:
  # No debug info in CI builds: faster to compile and link, and a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The app is Windows-only (low-level hooks, Credential Manager, WebView2).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: ci
          # PR caches are private to their PR; saving them only uses up the quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Frontend tests
        run: npx vitest run

      # Before the Rust steps: the Tauri build embeds the built frontend (dist/).
      - name: Frontend build
        run: npx vite build

      # Before anything compiles: it takes a second and fails fast.
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests (also regenerates the TypeScript IPC bindings)
        working-directory: src-tauri
        run: cargo test

      - name: Generated bindings are committed
        shell: bash
        run: git diff --exit-code -- src/ipc/bindings || (echo "Run cargo test in src-tauri and commit src/ipc/bindings." && exit 1)

      - name: Clippy (all targets, warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
