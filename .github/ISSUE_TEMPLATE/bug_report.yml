name: Bug report
description: Something in Neon Strider doesn't work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in System, or in the installer file name.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: treadmill
    attributes:
      label: Treadmill model
      placeholder: "Jogwell Ares 11 Elite"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        Open the log folder from System, then Diagnostics, then Open log folder. Paste the lines around the time of the problem.
        Remove anything personal first (names, paths, Strava details) before pasting.
      render: text
