<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon source. Regenerate the icon set with:
       npx tauri icon src-tauri/icons/app-icon.svg
       Same mark as tray.svg (stride chevrons over a belt line), with a border
       and glow that only have room at larger sizes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#04070b"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#5ffbff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="30" y="30" width="452" height="452" rx="102" fill="none" stroke="#00f3ff" stroke-opacity="0.45" stroke-width="6"/>
  <g filter="url(#glow)">
    <g fill="none" stroke="url(#chev)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 128 L226 226 L128 324"/>
      <path d="M272 128 L370 226 L272 324"/>
    </g>
    <rect x="104" y="382" width="304" height="44" rx="22" fill="#ff2bd6"/>
  </g>
</svg>
