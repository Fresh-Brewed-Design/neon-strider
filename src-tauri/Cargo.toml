[package]
name = "neon-strider"
version = "1.76.1"
description = "Desktop controller for FitShow Bluetooth treadmills"
authors = ["Fresh Brewed Design"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neon_strider_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Tray icon variants derived from icons/tray.png (build.rs).
png = "0.18"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# v4: the random OAuth `state` for each Strava Connect (strava/auth.rs).
uuid = { version = "1.0", features = ["v4"] }
# Native TLS (Windows SChannel) without ALPN, as on 0.11; 0.13 defaults to rustls.
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "charset", "http2", "system-proxy", "json", "multipart", "form", "query"] }
url = "2.2"
tiny_http = "0.12"
chrono = "0.4"
# no-serde-warnings: ts-rs ignores `serde(alias)` (a load-only spelling, as on
# CalibrationPoint), which is right for the types, and would warn on each one.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Windows Credential Manager on Windows, the Keychain on macOS.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-updater = "2"

[dev-dependencies]
# A paused clock for the simulated treadmill's seam test (sim_link.rs).
tokio = { version = "1", features = ["rt", "test-util"] }

# Windows-only code lives in src/platform/windows.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Foundation_Collections", "Storage_Streams"] }

# macOS-only code lives in src/platform/macos.rs: AppKit for the HUD window
# and the mouse monitors; CoreGraphics, CoreFoundation and Carbon are linked
# there directly (a few plain C calls).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSWindow"] }
block2 = "0.6"
# Open at login as a Login Item (SMAppService, macOS 13+).
smappservice-rs = "0.1"

[profile.dev]
incremental = true
debug = 0

[profile.dev.package."*"]
opt-level = 2
